      }

      // 拡大図のワークロール径（6段は大径、20段は極小径）を再構築
      function ensureInsetRolls(millType, t1Vis) {
        const key = `${millType}_${Math.round(t1Vis)}`;
        if (refs.insetRollMode === key) return;
        refs.insetRollMode = key;

        refs.insetTopRoll.innerHTML = '';
        refs.insetBotRoll.innerHTML = '';

        const wrR = millType === 'uc6' ? 92 : 42;
        const cx = 176;
        const cyTop = 84 - t1Vis * 0.5 - wrR;
        const cyBot = 84 + t1Vis * 0.5 + wrR;

        refs.insetTopRot = buildSketchRollSVG(refs.insetTopRoll, { x: cx, y: cyTop, r: wrR, role: 'WR', side: -1 }, 1100);
        refs.insetBotRot = buildSketchRollSVG(refs.insetBotRoll, { x: cx, y: cyBot, r: wrR, role: 'WR', side: 1 }, 1110);
      }

      /* =======================================================================
         6. アプリケーション状態・物理演算・カメラ＆ズーム制御
         ======================================================================= */
      const state = {
        playing: true,
        speed: 1.0,
        videoTime: 0,
        animTime: 0,

        millType: 'uc6',
        reduction: 0.60,
        xray: 0.0,
        xrayTarget: 0.0,
        showAnnotations: true,
        showInset: false,
        showSubtitles: true,

        // ユーザー手動操作オーバーライド（ユーザー操作を常に尊重）
        overrides: {
          mill: false,
          xray: false,
          red: false,
          anno: false,
          inset: false,
          subs: false,
          camera: false
        },

        // 物理累積量
        coilProgress: 0.14,
        entryPhase: 0,
        payoffAngle: 0,
        tensionAngle: 0,
        snubberAngle: 0,
        entryDefAngle: 0,
        exitDefAngle: 0,
        rollSurfaceDist: 0,
        imrShiftPhase: 0,

        // SVG viewBox カメラ（ストーリー自動ズーム & 自由ズーム/パン統合）
        cam: { ...VB_FULL },
        targetCam: { ...VB_FULL }
      };

      function getChapterAt(t) {
        for (let i = CHAPTERS.length - 1; i >= 0; i--) {
          if (t >= CHAPTERS[i].start) return CHAPTERS[i];
        }
        return CHAPTERS[0];
      }

      function getSubtitleAt(ch, t) {
        let s = ch.subs[0];
        for (const item of ch.subs) {
          if (t >= item.at) s = item;
        }
        return s;
      }

      // コイル外径（断面積保存則：R_po^2 + R_tr^2 = R_min^2 + R_max^2）
      function getCoilRadii() {
        const minSq = COIL_R_MIN * COIL_R_MIN;
        const maxSq = COIL_R_MAX * COIL_R_MAX;
        const p = Math.max(0.06, Math.min(0.94, state.coilProgress));
        return {
          rPayoff: Math.sqrt(maxSq - p * (maxSq - minSq)),
          rTension: Math.sqrt(minSq + p * (maxSq - minSq)),
          remainPct: Math.round((1 - p) * 100)
        };
      }

      function clampCamera(c) {
        const w = Math.max(VB_FULL.w / 6.0, Math.min(VB_FULL.w, c.w));
        const h = w * (VB_FULL.h / VB_FULL.w);
        const minX = -60;
        const maxX = VB_FULL.w - w + 60;
        const minY = -40;
        const maxY = VB_FULL.h - h + 40;
        return {
          x: Math.max(minX, Math.min(maxX, c.x)),
          y: Math.max(minY, Math.min(maxY, c.y)),
          w,
          h
        };
      }

      // 自動ストーリーのキーフレームを状態へ反映
      function syncStory(dt) {
        const ch = getChapterAt(state.videoTime);
        if (!state.overrides.mill) state.millType = ch.mill;
        if (!state.overrides.xray) state.xrayTarget = ch.xray;
        if (!state.overrides.red) state.reduction = ch.red;
        if (!state.overrides.anno) state.showAnnotations = ch.anno;
        if (!state.overrides.inset) state.showInset = ch.inset;
        if (!state.overrides.camera) {
          state.targetCam = clampCamera(ch.cam);
        }

        // 透過度の滑らかな補間
        const xDiff = state.xrayTarget - state.xray;
        state.xray = Math.abs(xDiff) < 0.002 ? state.xrayTarget : state.xray + xDiff * Math.min(1, dt * 4.2);

        // SVG viewBox カメラの滑らかな補間
        const k = state.overrides.camera ? Math.min(1, dt * 14) : Math.min(1, dt * 3.2);
        state.cam.x += (state.targetCam.x - state.cam.x) * k;
        state.cam.y += (state.targetCam.y - state.cam.y) * k;
        state.cam.w += (state.targetCam.w - state.cam.w) * k;
        state.cam.h += (state.targetCam.h - state.cam.h) * k;
      }

      // 物理ステート更新（体積一定則 v0*t0 = v1*t1 & 角速度 ω = v/R）
      function updatePhysics(dt) {
        const cfg = MILL_CONFIGS[state.millType];
        const ratio = 1 / (1 - state.reduction);
        const v0 = cfg.entrySpeed;
        const v1 = v0 * ratio;

        state.entryPhase += v0 * dt;
        state.rollSurfaceDist += ((v0 + v1) * 0.5) * dt;
        state.imrShiftPhase += dt * 1.25;

        if (state.playing) {
          state.coilProgress += dt * 0.014;
          if (state.coilProgress > 0.92) state.coilProgress = 0.08;
        }

        const { rPayoff, rTension } = getCoilRadii();
        state.payoffAngle += (v0 / rPayoff) * dt;
        state.tensionAngle += (v1 / rTension) * dt;
        state.snubberAngle -= (v0 / SNUBBER_R) * dt; // コイル外周と外接するため逆回転
        state.entryDefAngle += (v0 / ENTRY_DEF.r) * dt;
        state.exitDefAngle += (v1 / EXIT_DEF.r) * dt;
      }

      /* =======================================================================
         7. 毎フレーム SVG 属性・transform 反映（60fps ベクター更新）
         ======================================================================= */
      let lastLayerDrawKey = '';

      function updateSVGScene() {
        const cfg = MILL_CONFIGS[state.millType];
        const ratio = 1 / (1 - state.reduction);
        const t0 = cfg.t0;
        const t1 = t0 * (1 - state.reduction);
        const visT0 = cfg.visT0;
        const visT1 = Math.max(2.4, visT0 * (1 - state.reduction));
        const { rPayoff, rTension, remainPct } = getCoilRadii();

        // 1) SVG viewBox 更新
        mainSvg.setAttribute(
          'viewBox',
          `${state.cam.x.toFixed(2)} ${state.cam.y.toFixed(2)} ${state.cam.w.toFixed(2)} ${state.cam.h.toFixed(2)}`
        );

        // 2) 圧延機表示切替 & 内部透過反映
        const is20 = state.millType === 'cluster20';
        mill6HiGroup.setAttribute('display', is20 ? 'none' : 'inline');
        mill20HiGroup.setAttribute('display', is20 ? 'inline' : 'none');

        const solidOp = Math.pow(1 - state.xray, 1.35);
        const phantomOp = state.xray > 0.03 ? Math.min(0.75, state.xray * 0.85) : 0;
        const internalOp = Math.min(1, 0.14 + state.xray * 1.15);

        refs.housing6Solid.setAttribute('opacity', solidOp.toFixed(3));
        refs.housing6Phantom.setAttribute('opacity', phantomOp.toFixed(3));
        refs.internal6.setAttribute('opacity', internalOp.toFixed(3));

        refs.housing20Solid.setAttribute('opacity', solidOp.toFixed(3));
        refs.housing20Phantom.setAttribute('opacity', phantomOp.toFixed(3));
        refs.internal20.setAttribute('opacity', internalOp.toFixed(3));

        // 3) ペイオフ・テンションコイル径 & 巻き層 & 回転角
        refs.payoffOuterCircle.setAttribute('r', rPayoff.toFixed(2));
        refs.tensionOuterCircle.setAttribute('r', rTension.toFixed(2));

        const degPO = (state.payoffAngle * 180) / Math.PI;
        const degTR = (state.tensionAngle * 180) / Math.PI;
        refs.payoffRotGroup.setAttribute('transform', `rotate(${degPO.toFixed(2)})`);
        refs.tensionRotGroup.setAttribute('transform', `rotate(${degTR.toFixed(2)})`);

        // コイル端面スポーク長を外径に同期（はみ出し防止）
        refs.payoffRotGroup.querySelectorAll('.coil-spoke').forEach((ln, i) => {
          const a = (i * Math.PI) / 2;
          ln.setAttribute('x2', (Math.cos(a) * (rPayoff - 3)).toFixed(1));
          ln.setAttribute('y2', (Math.sin(a) * (rPayoff - 3)).toFixed(1));
        });
        refs.tensionRotGroup.querySelectorAll('.coil-spoke').forEach((ln, i) => {
          const a = (i * Math.PI) / 2;
          ln.setAttribute('x2', (Math.cos(a) * (rTension - 3)).toFixed(1));
          ln.setAttribute('y2', (Math.sin(a) * (rTension - 3)).toFixed(1));
        });

        // 巻き層リングは径が1px以上変わった時だけ再生成して高速化
        const layerKey = `${Math.round(rPayoff)}_${Math.round(rTension)}`;
        if (layerKey !== lastLayerDrawKey) {
          lastLayerDrawKey = layerKey;
          const fillRings = (grp, outerR, step) => {
            grp.innerHTML = '';
            for (let rr = COIL_R_CORE + step; rr < outerR - 1.5; rr += step) {
              svgEl('circle', {
                cx: 0, cy: 0, r: rr.toFixed(1),
                fill: 'none', stroke: '#742e10', 'stroke-width': 0.9, 'stroke-opacity': 0.42
              }, grp);
            }
          };
          fillRings(refs.payoffLayersGroup, rPayoff, 6.2);
          fillRings(refs.tensionLayersGroup, rTension, 3.8);
        }

        // スナバーロールをペイオフコイル外周の左上48度位置にリアルタイム追従接触
        const snAng = -Math.PI * 0.72;
        const snDist = rPayoff + SNUBBER_R;
        const snX = PAYOFF_C.x + Math.cos(snAng) * snDist;
        const snY = PAYOFF_C.y + Math.sin(snAng) * snDist;
        refs.snubberArmLine.setAttribute('x2', snX.toFixed(1));
        refs.snubberArmLine.setAttribute('y2', snY.toFixed(1));
        refs.snubberArmLine2.setAttribute('x2', snX.toFixed(1));
        refs.snubberArmLine2.setAttribute('y2', snY.toFixed(1));
        refs.snubberRollWrap.setAttribute('transform', `translate(${snX.toFixed(1)}, ${snY.toFixed(1)})`);
        refs.snubberRollRot.setAttribute('transform', `rotate(${((state.snubberAngle * 180) / Math.PI).toFixed(2)})`);

        // デフレクターロール回転
        refs.entryDefRot.setAttribute('transform', `rotate(${((state.entryDefAngle * 180) / Math.PI).toFixed(2)})`);
        refs.exitDefRot.setAttribute('transform', `rotate(${((state.exitDefAngle * 180) / Math.PI).toFixed(2)})`);

        // 4) 銅条の幾何形状＆体積一定マーカー更新
        const tanL = upperExternalTangent(PAYOFF_C, rPayoff, ENTRY_DEF, ENTRY_DEF.r);
        const tanR = upperExternalTangent(EXIT_DEF, EXIT_DEF.r, TENSION_C, rTension);
        const biteHalf = is20 ? 9 : 14;
        const biteInX = MILL_CX - biteHalf;
        const biteOutX = MILL_CX + biteHalf;

        const setBandPoly = (polyEl, pA, pB, thick) => {
          const dx = pB.x - pA.x;
          const dy = pB.y - pA.y;
          const len = Math.hypot(dx, dy) || 1;
          const nx = (-dy / len) * (thick * 0.5);
          const ny = (dx / len) * (thick * 0.5);
          polyEl.setAttribute(
            'points',
            `${(pA.x + nx).toFixed(1)},${(pA.y + ny).toFixed(1)} ` +
            `${(pB.x + nx).toFixed(1)},${(pB.y + ny).toFixed(1)} ` +
            `${(pB.x - nx).toFixed(1)},${(pB.y - ny).toFixed(1)} ` +
            `${(pA.x - nx).toFixed(1)},${(pA.y - ny).toFixed(1)}`
          );
        };

        const entryDefTop = { x: ENTRY_DEF.x, y: PASSLINE_Y };
        const exitDefTop = { x: EXIT_DEF.x, y: PASSLINE_Y };
        setBandPoly(refs.stripEntrySlope, tanL.p1, entryDefTop, visT0);
        setBandPoly(refs.stripEntryHoriz, entryDefTop, { x: biteInX, y: PASSLINE_Y }, visT0);

        const midH = (visT0 * 0.35 + visT1 * 0.65) * 0.5;
        refs.stripBite.setAttribute(
          'points',
          `${biteInX},${(PASSLINE_Y - visT0 * 0.5).toFixed(1)} ` +
          `${MILL_CX},${(PASSLINE_Y - midH).toFixed(1)} ` +
          `${biteOutX},${(PASSLINE_Y - visT1 * 0.5).toFixed(1)} ` +
          `${biteOutX},${(PASSLINE_Y + visT1 * 0.5).toFixed(1)} ` +
          `${MILL_CX},${(PASSLINE_Y + midH).toFixed(1)} ` +
          `${biteInX},${(PASSLINE_Y + visT0 * 0.5).toFixed(1)}`
        );

        setBandPoly(refs.stripExitHoriz, { x: biteOutX, y: PASSLINE_Y }, exitDefTop, visT1);
        setBandPoly(refs.stripExitSlope, exitDefTop, tanR.p2, visT1);

        // 体積一定則マーカー（入側：ピッチ spacing0、出側：ピッチ spacing0 * ratio）
        const spacing0 = 26;
        const entryHorizLen = biteInX - entryDefTop.x;
        const exitHorizLen = exitDefTop.x - biteOutX;
        const inOff = ((state.entryPhase % spacing0) + spacing0) % spacing0;

        refs.entryMarkers.forEach((m, i) => {
          const x = entryDefTop.x + inOff + i * spacing0;
          if (x <= biteInX - 2) {
            m.setAttribute('display', 'inline');
            m.setAttribute('transform', `translate(${x.toFixed(1)}, ${PASSLINE_Y})`);
          } else {
            m.setAttribute('display', 'none');
          }
        });

        const spacing1 = spacing0 * ratio;
        const outOff = (((state.entryPhase - entryHorizLen) * ratio) % spacing1 + spacing1) % spacing1;
        refs.exitMarkers.forEach((m, i) => {
          const x = biteOutX + outOff + i * spacing1;
          if (x <= exitDefTop.x - 2) {
            m.setAttribute('display', 'inline');
            m.setAttribute('transform', `translate(${x.toFixed(1)}, ${PASSLINE_Y})`);
          } else {
            m.setAttribute('display', 'none');
          }
        });

        // 板厚計・速度ラベル更新
        refs.entryGaugeValText.textContent = `${t0.toFixed(2)} mm`;
        refs.exitGaugeValText.textContent = `${t1.toFixed(2)} mm`;
        refs.speedEntryLabel.textContent = `速度 v₀ (1.00×)`;
        refs.speedExitLabel.textContent = `速度 v₁ (${ratio.toFixed(2)}×)`;

        // 5) 圧延機 全ロールの連動回転（周速完全一致）
        const activeRolls = is20 ? refs.rolls20 : refs.rolls6;
        for (const item of activeRolls) {
          const deg = ((state.rollSurfaceDist / item.roll.r) * item.roll.dir * 180) / Math.PI;
          item.rotG.setAttribute('transform', `rotate(${deg.toFixed(2)})`);
        }

        // 6段UC中間ロールシフト動作の視覚表現
        if (!is20) {
          const shiftPx = Math.sin(state.imrShiftPhase) * 18;
          for (const ind of refs.imrShiftIndicators) {
            const sDir = ind.side < 0 ? 1 : -1;
            ind.el.setAttribute('x', (ind.baseX + sDir * shiftPx - 4).toFixed(1));
          }
        }

        // 油圧圧下矢印の微脈動
        const pulse = Math.sin(state.animTime * 4.5) * 1.5;
        refs.hydraulicArrows.forEach((arr) => {
          arr.setAttribute('transform', `translate(0, ${pulse.toFixed(2)})`);
        });

        // 6) クーラント飛沫アニメーション
        const activeCoolant = is20 ? refs.coolantParticles20 : refs.coolantParticles6;
        if (state.xray > 0.02) {
          for (const pt of activeCoolant) {
            const t = (pt.phase + state.animTime * 1.35 * pt.speed) % 1;
            const nx = MILL_CX + pt.sx * pt.nozzleX;
            const ny = PASSLINE_Y + pt.sy * pt.nozzleY;
            const tx = MILL_CX + pt.sx * 8;
            const ty = PASSLINE_Y + pt.sy * 4;
            const px = nx + (tx - nx) * t + pt.spread * 9 * t;
            const py = ny + (ty - ny) * t + pt.spread * 7 * t + t * t * 6;
            const op = Math.sin(t * Math.PI) * 0.85;
            pt.el.setAttribute('cx', px.toFixed(1));
            pt.el.setAttribute('cy', py.toFixed(1));
            pt.el.setAttribute('r', (1.2 + (1 - t) * 1.3).toFixed(2));
            pt.el.setAttribute('opacity', op.toFixed(2));
          }
        }

        // 7) 注釈レイヤーの動的切替（圧延機タイプ × 透過状態）
        layerAnnotations.setAttribute('display', state.showAnnotations ? 'inline' : 'none');
        if (state.showAnnotations) {
          const isXrayMode = state.xray >= 0.32;
          refs.annoSolid6.setAttribute('display', (!is20 && !isXrayMode) ? 'inline' : 'none');
          refs.annoSolid20.setAttribute('display', (is20 && !isXrayMode) ? 'inline' : 'none');
          refs.annoXray6.setAttribute('display', (!is20 && isXrayMode) ? 'inline' : 'none');
          refs.annoXray20.setAttribute('display', (is20 && isXrayMode) ? 'inline' : 'none');
        }

        // 8) ロールバイト拡大図インセット（独立ベクターSVGの60fps更新）
        if (state.showInset) {
          updateRollBiteInset(t0, t1, ratio);
        }

        // 9) HUDリアルタイム諸元反映
        el.specMillShort.textContent = cfg.short;
        el.specT0.textContent = `${t0.toFixed(2)} mm`;
        el.specT1.textContent = `${t1.toFixed(2)} mm`;
        el.specRed.textContent = `${(state.reduction * 100).toFixed(1)} %`;
        el.specRatio.textContent = `${ratio.toFixed(2)} ×`;
        el.specCoilText.textContent = `巻出残 ${remainPct}%`;
        el.specCoilFill.style.width = `${remainPct}%`;
        el.zoomReadout.textContent = `${(VB_FULL.w / state.cam.w).toFixed(1)}×`;
      }

      // ロールバイト拡大図（等軸結晶粒→扁平繊維組織・加工硬化・中立点）更新
      function updateRollBiteInset(t0, t1, ratio) {
        const zT0 = 46;
        const zT1 = Math.max(12, zT0 * (1 - state.reduction));
        const biteStart = state.millType === 'uc6' ? 114 : 138;
        const biteEnd = 176;
        const cy = 84;

        ensureInsetRolls(state.millType, zT1);

        // 銅条変形プロファイル（入側→ロール弧に沿って圧下→出側）
        const dPath =
          `M 0 ${(cy - zT0 * 0.5).toFixed(1)} ` +
          `L ${biteStart} ${(cy - zT0 * 0.5).toFixed(1)} ` +
          `Q ${((biteStart + biteEnd) * 0.52).toFixed(1)} ${(cy - zT1 * 0.56).toFixed(1)} ${biteEnd} ${(cy - zT1 * 0.5).toFixed(1)} ` +
          `L 310 ${(cy - zT1 * 0.5).toFixed(1)} ` +
          `L 310 ${(cy + zT1 * 0.5).toFixed(1)} ` +
          `L ${biteEnd} ${(cy + zT1 * 0.5).toFixed(1)} ` +
          `Q ${((biteStart + biteEnd) * 0.52).toFixed(1)} ${(cy + zT1 * 0.56).toFixed(1)} ${biteStart} ${(cy + zT0 * 0.5).toFixed(1)} ` +
          `L 0 ${(cy + zT0 * 0.5).toFixed(1)} Z`;

        refs.insetStripShape.setAttribute('d', dPath);
        refs.insetStripClipPath.setAttribute('d', dPath);

        // クーラント潤滑くさび
        refs.insetCoolantTop.setAttribute(
          'd',
          `M ${biteStart - 34} ${(cy - zT0 * 0.5 - 16).toFixed(1)} L ${biteStart + 16} ${(cy - zT0 * 0.5).toFixed(1)} L ${biteStart - 22} ${(cy - zT0 * 0.5).toFixed(1)} Z`
        );
        refs.insetCoolantBot.setAttribute(
          'd',
          `M ${biteStart - 34} ${(cy + zT0 * 0.5 + 16).toFixed(1)} L ${biteStart + 16} ${(cy + zT0 * 0.5).toFixed(1)} L ${biteStart - 22} ${(cy + zT0 * 0.5).toFixed(1)} Z`
        );

        // ワークロール回転
        const rollScaleR = state.millType === 'uc6' ? 28 : 14;
        const deg = ((state.rollSurfaceDist / rollScaleR) * 180) / Math.PI;
        if (refs.insetTopRot) refs.insetTopRot.setAttribute('transform', `rotate(${(-deg).toFixed(2)})`);
        if (refs.insetBotRot) refs.insetBotRot.setAttribute('transform', `rotate(${deg.toFixed(2)})`);

        // 結晶粒の流動と扁平・繊維組織化（体積一定で縦に潰れ横に伸びて加速！）
        const step0 = 22;
        const totalCols = 14;
        const flowPhase = (state.entryPhase * 0.72) % (step0 * totalCols);

        for (const g of refs.insetGrains) {
          // 基準座標 u（入側仮想座標 0..308）
          const u = ((g.col * step0 + flowPhase) % (step0 * totalCols));
          let x, localH, stretch;
          if (u <= biteStart) {
            x = u;
            localH = zT0;
            stretch = 1.0;
          } else {
            // ロールバイト通過以降は体積一定で横方向位置が ratio 倍に伸長
            const du = u - biteStart;
            const biteSpan = biteEnd - biteStart;
            if (du < biteSpan * 0.65) {
              const frac = du / (biteSpan * 0.65);
              const avgRatio = 1 + (ratio - 1) * frac * 0.65;
              x = biteStart + du * avgRatio;
              stretch = 1 + (ratio - 1) * frac;
              localH = zT0 / stretch;
            } else {
              const afterU = du - biteSpan * 0.65;
              const startX = biteStart + biteSpan * 0.65 * (1 + (ratio - 1) * 0.65);
              x = startX + afterU * ratio;
              stretch = ratio;
              localH = zT1;
            }
          }

          if (x > 330) {
            g.el.setAttribute('display', 'none');
            continue;
          }
          g.el.setAttribute('display', 'inline');
          const rowFrac = (g.row - 1) * 0.30 + g.jitterY;
          const gy = cy + localH * rowFrac;
          const rx = Math.min(18, 5.2 * Math.pow(stretch, 0.85));
          const ry = Math.max(1.6, 4.4 / Math.pow(stretch, 0.85));

          g.el.setAttribute('cx', x.toFixed(1));
          g.el.setAttribute('cy', gy.toFixed(1));
          g.el.setAttribute('rx', rx.toFixed(2));
          g.el.setAttribute('ry', ry.toFixed(2));
        }

        refs.insetLabelIn.textContent = `等軸結晶粒 (t₀=${t0.toFixed(2)}mm)`;
        refs.insetLabelOut.textContent = `繊維組織・加工硬化 (t₁=${t1.toFixed(2)}mm)`;
        refs.insetWRBadge.textContent = MILL_CONFIGS[state.millType].wrBadge;
        refs.insetCaption.textContent = state.millType === 'uc6'
          ? `6段WR｜圧下率 ${(state.reduction * 100).toFixed(0)}%・速度比 ${ratio.toFixed(2)}×（加工硬化で高強度化）`
          : `極小径WRで接触弧短縮｜圧下率 ${(state.reduction * 100).toFixed(0)}%・速度比 ${ratio.toFixed(2)}×`;
      }

      /* =======================================================================
         8. UI 要素バインディング & 自由ズーム＆パン操作（マウス・タッチ対応）
         ======================================================================= */
      const el = {
        hudChapterText: document.getElementById('hudChapterText'),
        zoomReadout: document.getElementById('zoomReadout'),
        btnZoomIn: document.getElementById('btnZoomIn'),
        btnZoomOut: document.getElementById('btnZoomOut'),
        btnResetView: document.getElementById('btnResetView'),
        specMillShort: document.getElementById('specMillShort'),
        specT0: document.getElementById('specT0'),
        specT1: document.getElementById('specT1'),
        specRed: document.getElementById('specRed'),
        specRatio: document.getElementById('specRatio'),
        specCoilText: document.getElementById('specCoilText'),
        specCoilFill: document.getElementById('specCoilFill'),
        insetCard: document.getElementById('insetCard'),
        subtitleBar: document.getElementById('subtitleBar'),
        subBadge: document.getElementById('subBadge'),
        subLine1: document.getElementById('subLine1'),
        subLine2: document.getElementById('subLine2'),
        btnPlayPause: document.getElementById('btnPlayPause'),
        playIcon: document.getElementById('playIcon'),
        playText: document.getElementById('playText'),
        btnRestart: document.getElementById('btnRestart'),
        speedSelect: document.getElementById('speedSelect'),
        seekBar: document.getElementById('seekBar'),
        timeLabel: document.getElementById('timeLabel'),
        chapterBar: document.getElementById('chapterBar'),
        btnMill6: document.getElementById('btnMill6'),
        btnMill20: document.getElementById('btnMill20'),
        btnXray: document.getElementById('btnXray'),
        xraySlider: document.getElementById('xraySlider'),
        xrayVal: document.getElementById('xrayVal'),
        redSlider: document.getElementById('redSlider'),
        redVal: document.getElementById('redVal'),
        btnAnno: document.getElementById('btnAnno'),
        btnInset: document.getElementById('btnInset'),
        btnSubs: document.getElementById('btnSubs'),
        btnAutoSync: document.getElementById('btnAutoSync'),
        toast: document.getElementById('toast')
      };

      let toastTimer = null;
      function showToast(msg) {
        el.toast.textContent = msg;
        el.toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.toast.classList.remove('show'), 2400);
      }

      function fmtTime(sec) {
        const s = Math.max(0, Math.floor(sec));
        return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      }

      // チャプターボタン生成
      const chapButtons = [];
      CHAPTERS.forEach((ch) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'chap-btn';
        b.textContent = ch.short;
        b.title = ch.title;
        b.addEventListener('click', () => {
          state.videoTime = ch.start + 0.05;
          clearOverrides(false);
          syncStory(0.05);
          state.playing = true;
          syncUI();
          showToast(ch.title);
        });
        el.chapterBar.appendChild(b);
        chapButtons.push(b);
      });

      function hasOverrides() {
        return Object.values(state.overrides).some(Boolean);
      }

      function clearOverrides(notify = true) {
        Object.keys(state.overrides).forEach((k) => { state.overrides[k] = false; });
        if (notify) showToast('自動ストーリー演出とカメラ追従に同期しました');
      }

      function syncUI() {
        const ch = getChapterAt(state.videoTime);
        const sub = getSubtitleAt(ch, state.videoTime);

        el.hudChapterText.textContent = ch.title;
        el.subBadge.textContent = `CH ${ch.id} / ${CHAPTERS.length}`;
        el.subLine1.textContent = sub.l1;
        el.subLine2.textContent = sub.l2;
        el.subtitleBar.classList.toggle('hidden', !state.showSubtitles);
        el.insetCard.classList.toggle('hidden', !state.showInset);

        el.playIcon.textContent = state.playing ? '⏸' : '▶';
        el.playText.textContent = state.playing ? '一時停止' : '再生';
        el.seekBar.value = state.videoTime.toFixed(2);
        el.timeLabel.textContent = `${fmtTime(state.videoTime)} / ${fmtTime(TOTAL_DURATION)}`;

        chapButtons.forEach((b, idx) => b.classList.toggle('active', CHAPTERS[idx].id === ch.id));

        el.btnMill6.classList.toggle('active', state.millType === 'uc6');
        el.btnMill20.classList.toggle('active', state.millType === 'cluster20');

        const xp = Math.round(state.xray * 100);
        const xOn = state.xrayTarget >= 0.3;
        el.btnXray.classList.toggle('active', xOn);
        el.btnXray.textContent = xOn ? '内部透過 ON' : '内部透過 OFF';
        el.xraySlider.value = String(xp);
        el.xrayVal.textContent = `${xp}%`;

        const rp = Math.round(state.reduction * 100);
        el.redSlider.value = String(rp);
        el.redVal.textContent = `${rp}%`;

        el.btnAnno.classList.toggle('active', state.showAnnotations);
        el.btnAnno.textContent = state.showAnnotations ? '注釈 ON' : '注釈 OFF';

        el.btnInset.classList.toggle('active', state.showInset);
        el.btnInset.textContent = state.showInset ? '拡大図 ON' : '拡大図 OFF';

        el.btnSubs.classList.toggle('active', state.showSubtitles);
        el.btnSubs.textContent = state.showSubtitles ? '字幕 ON' : '字幕 OFF';

        el.btnAutoSync.classList.toggle('visible', hasOverrides());
      }

      // 画面座標 → SVGワールド座標変換
      function clientToSvgPoint(clientX, clientY) {
        const rect = mainSvg.getBoundingClientRect();
        // preserveAspectRatio="xMidYMid meet" の実際の描画領域を厳密計算
        const vbRatio = state.cam.w / state.cam.h;
        const elRatio = rect.width / rect.height;
        let drawW = rect.width;
        let drawH = rect.height;
        let offX = 0;
        let offY = 0;
        if (elRatio > vbRatio) {
          drawW = rect.height * vbRatio;
          offX = (rect.width - drawW) * 0.5;
        } else {
          drawH = rect.width / vbRatio;
          offY = (rect.height - drawH) * 0.5;
        }
        const nx = (clientX - rect.left - offX) / drawW;
        const ny = (clientY - rect.top - offY) / drawH;
        return {
          x: state.cam.x + nx * state.cam.w,
          y: state.cam.y + ny * state.cam.h,
          scaleX: state.cam.w / drawW,
          scaleY: state.cam.h / drawH
        };
      }

      function zoomAt(factor, pivotClientX, pivotClientY) {
        state.overrides.camera = true;
        const pt = (pivotClientX !== undefined)
          ? clientToSvgPoint(pivotClientX, pivotClientY)
          : { x: state.targetCam.x + state.targetCam.w * 0.5, y: state.targetCam.y + state.targetCam.h * 0.5 };

        const curZoom = VB_FULL.w / state.targetCam.w;
        const nextZoom = Math.max(1.0, Math.min(6.0, curZoom * factor));
        const nextW = VB_FULL.w / nextZoom;
        const nextH = VB_FULL.h / nextZoom;

        const rx = (pt.x - state.targetCam.x) / state.targetCam.w;
        const ry = (pt.y - state.targetCam.y) / state.targetCam.h;

        state.targetCam = clampCamera({
          x: pt.x - rx * nextW,
          y: pt.y - ry * nextH,
          w: nextW,
          h: nextH
        });
        syncUI();
      }

      // マウスホイールズーム（1.0x〜6.0x）
      mainSvg.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.18 : 1 / 1.18;
        zoomAt(factor, e.clientX, e.clientY);
      }, { passive: false });

      // ドラッグパン移動（マウス & タッチ統一 PointerEvent）
      let isDragging = false;
      let dragStartClient = { x: 0, y: 0 };
      let dragStartCam = { ...VB_FULL };
      let dragScale = { x: 1, y: 1 };

      mainSvg.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        isDragging = true;
        mainSvg.classList.add('dragging');
        mainSvg.setPointerCapture(e.pointerId);
        const info = clientToSvgPoint(e.clientX, e.clientY);
        dragStartClient = { x: e.clientX, y: e.clientY };
        dragStartCam = { ...state.targetCam };
        dragScale = { x: info.scaleX, y: info.scaleY };
      });

      mainSvg.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = (e.clientX - dragStartClient.x) * dragScale.x;
        const dy = (e.clientY - dragStartClient.y) * dragScale.y;
        if (Math.hypot(dx, dy) > 2) {
          state.overrides.camera = true;
          state.targetCam = clampCamera({
            x: dragStartCam.x - dx,
            y: dragStartCam.y - dy,
            w: dragStartCam.w,
            h: dragStartCam.h
          });
          // ドラッグ中は遅延なくダイレクト追従
          state.cam = { ...state.targetCam };
        }
      });

      const endDrag = () => {
        if (!isDragging) return;
        isDragging = false;
        mainSvg.classList.remove('dragging');
        syncUI();
      };
      mainSvg.addEventListener('pointerup', endDrag);
      mainSvg.addEventListener('pointercancel', endDrag);

      // ズームボタン & 視点リセット
      el.btnZoomIn.addEventListener('click', () => zoomAt(1.35));
      el.btnZoomOut.addEventListener('click', () => zoomAt(1 / 1.35));
      el.btnResetView.addEventListener('click', () => {
        state.overrides.camera = true;
        state.targetCam = { ...VB_FULL };
        syncUI();
        showToast('全体表示（1.0×）へ戻しました');
      });

      // 再生・操作コントロール
      el.btnPlayPause.addEventListener('click', () => {
        state.playing = !state.playing;
        syncUI();
      });

      el.btnRestart.addEventListener('click', () => {
        state.videoTime = 0;
        state.coilProgress = 0.10;
        clearOverrides(false);
        syncStory(0.05);
        state.playing = true;
        syncUI();
        showToast('最初から自動解説を再生します');
      });

      el.speedSelect.addEventListener('change', () => {
        state.speed = parseFloat(el.speedSelect.value) || 1.0;
      });

      el.seekBar.addEventListener('input', () => {
        state.videoTime = parseFloat(el.seekBar.value) || 0;
        state.coilProgress = 0.10 + (state.videoTime / TOTAL_DURATION) * 0.78;
        syncStory(0.2);
        syncUI();
        updateSVGScene();
      });

      el.btnMill6.addEventListener('click', () => {
        state.millType = 'uc6';
        state.overrides.mill = true;
        if (!state.overrides.red) state.reduction = MILL_CONFIGS.uc6.defaultRed;
        syncUI();
        showToast('6段 UCミル に切り替えました');
      });

      el.btnMill20.addEventListener('click', () => {
        state.millType = 'cluster20';
        state.overrides.mill = true;
        if (!state.overrides.red) state.reduction = MILL_CONFIGS.cluster20.defaultRed;
        syncUI();
        showToast('20段圧延機（ゼンジミア）に切り替えました');
      });

      el.btnXray.addEventListener('click', () => {
        state.overrides.xray = true;
        state.xrayTarget = state.xrayTarget >= 0.3 ? 0.0 : 0.96;
        syncUI();
      });

      el.xraySlider.addEventListener('input', () => {
        const val = (parseInt(el.xraySlider.value, 10) || 0) / 100;
        state.overrides.xray = true;
        state.xrayTarget = val;
        state.xray = val;
        syncUI();
      });

      el.redSlider.addEventListener('input', () => {
        const val = (parseInt(el.redSlider.value, 10) || 60) / 100;
        state.overrides.red = true;
        state.reduction = val;
        syncUI();
      });

      el.btnAnno.addEventListener('click', () => {
        state.showAnnotations = !state.showAnnotations;
        state.overrides.anno = true;
        syncUI();
      });

      el.btnInset.addEventListener('click', () => {
        state.showInset = !state.showInset;
        state.overrides.inset = true;
        syncUI();
      });

      el.btnSubs.addEventListener('click', () => {
        state.showSubtitles = !state.showSubtitles;
        state.overrides.subs = true;
        syncUI();
      });

      el.btnAutoSync.addEventListener('click', () => {
        clearOverrides(true);
        syncStory(0.05);
        syncUI();
      });

      // キーボードショートカット
      window.addEventListener('keydown', (e) => {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
        if (e.code === 'Space') {
          e.preventDefault();
          state.playing = !state.playing;
          syncUI();
        } else if (e.key === '1') {
          el.btnMill6.click();
        } else if (e.key === '2') {
          el.btnMill20.click();
        } else if (e.key.toLowerCase() === 't') {
          el.btnXray.click();
        } else if (e.key.toLowerCase() === 'a') {
          el.btnAnno.click();
        } else if (e.key.toLowerCase() === 'z') {
          el.btnInset.click();
        } else if (e.key.toLowerCase() === 'r') {
          el.btnResetView.click();
        }
      });

      /* =======================================================================
         9. 初期化 & メインアニメーションループ（60fps requestAnimationFrame）
         ======================================================================= */
      let lastTs = 0;
      let uiAccum = 0;

      function animate(ts) {
        if (!lastTs) lastTs = ts;
        const rawDt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        const simDt = rawDt * state.speed;

        if (state.playing) {
          state.animTime += simDt;
          state.videoTime += simDt;
          if (state.videoTime >= TOTAL_DURATION) {
            state.videoTime = 0;
            state.coilProgress = 0.10;
          }
          syncStory(rawDt);
          updatePhysics(simDt);
        } else {
          syncStory(rawDt);
        }

        updateSVGScene();

        uiAccum += rawDt;
        if (uiAccum >= 0.07) {
          uiAccum = 0;
          syncUI();
        }

        requestAnimationFrame(animate);
      }

      window.onload = function () {
        buildLineEquipment();
        buildCopperStrip();
        buildReels();
        buildMill6Hi();
        buildMill20Hi();
        buildAllAnnotations();
        buildInsetGrains();

        syncStory(1.0);
        updateSVGScene();
        syncUI();
        requestAnimationFrame(animate);
      };
    })();
  </script>
</body>
</html>
